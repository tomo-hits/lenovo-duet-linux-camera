# SPDX-License-Identifier: CC0-1.0
# Rear highlight protection candidate; shared upstream AGC/AWB.
# Reference scene comparison is not a colour-chart calibration.
# Parsed by upstream libcamera c0049ea/0.7.2 common SoftISP algorithms.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # RAW10 shortest-exposure local probes at gain128/1390 centred on code64.
      # Limited two-gain/current-temperature evidence; no full dark calibration.
      blackLevel: 4096
  - Awb:
  - Adjust:
      gamma: 2.4
  - Af:
      # Provisional actuator map; full distance/dioptre calibration pending.
      map: [0.0, 50.0, 8.0, 800.0]
      ranges:
        normal: {min: 0.0, max: 8.0, default: 2.9}
      speeds:
        normal:
          step_coarse: 1.0
          step_fine: 0.2
          max_slew: 4.0
          dropout_frames: 0
          step_frames: 1
          retrigger_delay: 8
          retrigger_ratio: 0.70
          contrast_ratio: 0.75
      # Reject near-black contrast/noise; units are normalized 16-bit RAW.
      contrast_min_signal: 1024
      skip_frames: 2
      check_for_ir: false
  - Agc:
      relativeLuminanceTarget: [0, 0.13]
      AeConstraintMode:
        ConstraintNormal:
          upper:
            qLo: 0.98
            qHi: 1.0
            yTarget: [0, 0.65]
...
